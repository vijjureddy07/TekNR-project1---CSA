<!DOCTYPE html>
<!-- =============================================================================
      PURE FIELDS - LOGIN PAGE
      =============================================================================

      Project: Local Farm & Community Supported Agriculture (CSA) Website
      Version: 1.0.0
      Description: Focused popup-style login page for returning CSA members

      Table of Contents:
      ------------------
      1. Head Section - Meta tags, fonts, styles
      2. Auth Shell - Standalone centered modal wrapper
      3. Popup Header - Brand, title, and supporting line
      4. Login Form - Email, password, forgot password, and sign in
      5. Footer Switch - Link to registration page

================================================================================ -->
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ========================================
          1. HEAD SECTION
          ========================================
          Description: Metadata, fonts, and shared site styles
    ======================================== -->
    <meta name="description" content="Sign in to manage your Pure Fields CSA subscription, delivery details, and weekly farm box preferences.">
    <meta name="robots" content="noindex, nofollow">

    <title>Login | Pure Fields</title>
    <link rel="icon" type="image/jpeg" href="../../assets/images/growwpark_logo.jpg">

    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&amp;family=Poppins:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/dark-mode.css">
    <link rel="stylesheet" href="../../assets/css/rtl.css">
</head>
<body class="auth-page login-page">

    <!-- ========================================
          2. AUTH SHELL SECTION
          ========================================
          Purpose: Creates a standalone popup-style auth layout
          Accessibility: Main content is the only focus area on the page
    ======================================== -->
    <main id="main-content" class="auth-shell" tabindex="-1">
        <section class="auth-card" aria-labelledby="auth-title">

            <!-- ========================================
                  3. POPUP HEADER SECTION
                  ========================================
                  Purpose: Shows brand identity and login context
                  Accessibility: Uses one clear page heading
            ======================================== -->
            <header class="auth-header">
                <a href="../public/index.html" class="auth-logo" aria-label="Go to Pure Fields home page">
                    <i class="material-icons" aria-hidden="true">eco</i>
                    <span>Pure Fields</span>
                </a>
                <div class="auth-header__copy">
                    <p class="auth-eyebrow">Login</p>
                    <h1 id="auth-title">Welcome Back</h1>
                    <p>Manage your CSA subscription.</p>
                </div>
            </header>

            <!-- ========================================
                  4. LOGIN FORM SECTION
                  ========================================
                  Purpose: Lets returning members sign in quickly
                  Accessibility: Uses labeled fields and a visible recovery link
            ======================================== -->
            <form class="auth-form" action="../dashboards/user-dashboard.html" method="get" aria-label="Login form">
                <div class="auth-form__field">
                    <label for="login-email">Email</label>
                    <input id="login-email" name="email" type="email" placeholder="you@example.com" required>
                </div>

                <div class="auth-form__field">
                    <label for="login-password">Password</label>
                    <input id="login-password" name="password" type="password" placeholder="Enter your password" required>
                </div>

                <div class="auth-form__meta">
                    <a href="../public/contact-us.html" class="auth-text-link">Forgot Password</a>
                </div>

                <p class="form-error form-error-global" aria-live="polite"></p>
                <button type="submit" class="auth-submit">Sign In</button>
            </form>

            <!-- ========================================
                  5. FOOTER SWITCH SECTION
                  ========================================
                  Purpose: Moves first-time users into the register flow
                  Accessibility: Keeps the alternate path visible below the form
            ======================================== -->
            <footer class="auth-footer">
                <p>New here? <a href="register.html">Create an account</a></p>
            </footer>
        </section>
    </main>

    <script src="../../assets/js/main.js"></script>
</body>
</html>
